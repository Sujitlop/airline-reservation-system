<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Dashboard - Airline Reservation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">


  <header class="dashboard-header">
    <h1>Crew Dashboard</h1>
    <div>
      <span id="userName"></span>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>
  </header>


  <section class="card">
    <h2>My Profile</h2>
    <div class="profile-grid">
      <div><strong>Employee ID:</strong> <span id="crewId">--</span></div>
      <div><strong>Name:</strong> <span id="crewName">--</span></div>
      <div><strong>Job Title:</strong> <span id="crewJobTitle">--</span></div>
    </div>
  </section>

 
  <section class="card">
    <h2>My Flight Schedule</h2>

    <table>
      <thead>
        <tr>
          <th>Flight #</th>
          <th>Origin</th>
          <th>Destination</th>
          <th>Date</th>
          <th>Departure</th>
          <th>Arrival</th>
          <th>Gate</th>
          <th>Status</th>
          <th>Aircraft</th>
        </tr>
      </thead>
      <tbody id="crewScheduleTable">
        <tr>
          <td colspan="9" class="placeholder">
            Assigned flights will appear here
          </td>
        </tr>
      </tbody>
    </table>
  </section>


  <section class="card">
    <h2>Report Flight Status</h2>

    <form id="flightStatusForm">

      <div class="form-group">
        <label>Flight Number</label>
        <input type="text" placeholder="F1001" required>
      </div>

      <div class="form-group">
        <label for="statusSelect">Status</label>
        <select id="statusSelect" required>
          <option value="">Select Status</option>
          <option value="Scheduled">Scheduled</option>
          <option value="Boarding">Boarding</option>
          <option value="Delayed">Delayed</option>
          <option value="Departed">Departed</option>
          <option value="Arrived">Arrived</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div class="form-group">
        <label>Report Log</label>
        <input type="text" placeholder="OnTime / MinorDelay / SmoothFlight">
      </div>

      <button type="submit" class="btn-primary">
        Submit Report
      </button>

    </form>

  </section>

</div>

<script src="app.js"></script>
</body>
</html>
